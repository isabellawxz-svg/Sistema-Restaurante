{% extends "layout_admin.html" %}
{% block title %}Cardápio{% endblock %}
{% block h1 %}Cardápio e preços{% endblock %}
{% block content %}
<section class="cadastro-item">
    <h2>Novo item</h2>
    <form id="form-item">
        <label for="nome">Nome do item:</label>
        <input type="text" id="nome" name="nome" required>
        <label for="categoria">Categoria (opcional):</label>
        <input type="text" id="categoria" name="categoria" maxlength="60" placeholder="Ex.: Bebidas, Lanches">
        <label for="preco">Preço (R$):</label>
        <input type="number" id="preco" name="preco" step="0.01" min="0" required>
        <button type="submit">Cadastrar</button>
    </form>
    <p id="msg-admin"></p>
</section>
<section class="lista-itens-admin">
    <h2>Itens cadastrados</h2>
    <ul id="lista-itens-admin"></ul>
</section>
{% endblock %}
{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    carregarCardapioAdmin();
    document.getElementById("form-item").addEventListener("submit", cadastrarItem);
});
</script>
{% endblock %}
