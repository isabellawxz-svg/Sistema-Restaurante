<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio e Pedidos</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- index.html: Página principal do sistema - exibe o cardápio, área para anotar pedido e lista de pedidos. -->
    <nav class="nav-bar">
        <a href="/" class="ativo">Cardápio e Pedidos</a>
        <a href="/admin">Cadastrar itens</a>
    </nav>
    <header>
        <h1>Restaurante - Cardápio e Pedidos</h1>
    </header>

    <main>
        <section class="cardapio">
            <h2>Cardápio</h2>
            <ul id="lista-cardapio">
                <!-- Itens do cardápio são carregados via JavaScript (fetch na API). -->
            </ul>
        </section>

        <section class="anotar-pedido">
            <h2>Anotar pedido</h2>
            <p>Selecione os itens e as quantidades:</p>
            <div id="form-pedido">
                <!-- Campos de quantidade por item são gerados pelo JavaScript. -->
            </div>
            <button type="button" id="btn-enviar-pedido">Enviar pedido</button>
            <p id="msg-pedido"></p>
        </section>

        <section class="pedidos">
            <h2>Pedidos realizados</h2>
            <div id="lista-pedidos">
                <!-- Lista de pedidos é preenchida via JavaScript (GET /api/pedidos). -->
            </div>
        </section>
    </main>

    <script src="/static/app.js"></script>
    <script>
        // Inicialização da página principal: carrega cardápio, monta formulário de pedido e lista pedidos.
        document.addEventListener("DOMContentLoaded", function() {
            carregarCardapio();
            carregarPedidos();
            document.getElementById("btn-enviar-pedido").addEventListener("click", enviarPedido);
        });
    </script>
</body>
</html>
